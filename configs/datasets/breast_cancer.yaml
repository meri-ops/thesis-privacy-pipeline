# Breast Cancer Wisconsin (Diagnostic), incluso in scikit-learn (nessun
# download, nessuna ambiguita' di versione).
#
# Scelto come sostituto sanitario di diabetes_130us per RQ1: 569 righe (molto
# piu' piccolo di adult_income, buon contrasto di taglia), 30 feature
# numeriche continue (piu' delle 14 di adult_income), target moderatamente
# sbilanciato (circa37%/63%, 212 maligni / 357 benigni) -> nessun class_weight
# necessario. Una riga per paziente: nessun rischio di leakage da encounter
# ripetuti 

dataset:
  name: breast_cancer
  source: sklearn
  sklearn_dataset: breast_cancer
  target_column: target      # 0 = maligno, 1 = benigno (convenzione sklearn)
  real_data_path: data/real/breast_cancer.csv
  test_size: 0.2

synthetic:
  output_path: data/synthetic/breast_cancer_synthetic.csv
