# Griglia di esperimenti per la campagna sperimentale multi-dataset (Fase 3
# del refactoring). Un solo punto da cui decidere "cosa sto confrontando":
# lo modifichi, non tocchi codice (run_experiments.py resta invariato).
#
# diabetes_130us sostituito con breast_cancer: sbilanciamento estremo del
# target (~9%/91%) senza class_weight rendeva il modello incapace di
# riconoscere la classe minoritaria sia su reale che su sintetico (recall
# vicino a 0 in entrambi i casi), rendendo il confronto A/B poco
# informativo.
#
# german_credit aggiunto come terzo dataset (di nuovo 3, come nel documento
# di refactoring originale) per completare la mappa di complessita':
# adult_income (molte righe + alcune categoriche) e breast_cancer (poche
# righe + zero categoriche) variano insieme due assi (dimensione dataset,
# tipo di feature), quindi non permettono da soli di capire quale dei due
# spieghi l'inversione osservata nel vincitore metodologico (CTGAN batte
# GaussianCopula su Adult, il contrario su Breast Cancer). german_credit
# occupa l'angolo complementare: poche righe (1.000) + molte colonne
# categoriche (13/20) — vedi discussione in chat e
# configs/datasets/german_credit.yaml.
#
# credit_default (vedi configs/datasets/credit_default.yaml) resta
# implementato nel codice ma escluso da questa griglia: troppo simile ad
# adult_income su n. righe e class balance per aggiungere reale varieta'.

datasets:
  - adult_income
  - breast_cancer
  - german_credit

synthetic_methods:
  - gaussian_copula
  - ctgan

# Per la RQ3 (riproducibilita'): quante volte ripetere la generazione con
# lo STESSO seed. Si applica solo a ctgan: gaussian_copula, dopo il fix del
# seed globale (src/pipeline.py::set_global_seed), e' atteso deterministico
# al 100% e viene quindi eseguito una sola volta (replica_id = 0).
#
# Ridotto da 3 a 1 per QUESTO rilancio (relaunch per recuperare DCR
# Overfitting Protection, saltato per un bug di dipendenza nella campagna
# precedente): la riproducibilita' di CTGAN con seed fisso e' gia' stata
# dimostrata empiricamente (hash identico su 3 repliche indipendenti, per
# tutti e 3 i dataset — vedi reports/runs_index.jsonl della campagna
# precedente), quindi ripetere 3 volte qui non aggiungerebbe informazione,
# solo tempo. Se in futuro serve rifare la prova di riproducibilita' da
# zero, rimettere a 3.
repeats_for_reproducibility: 3

model:
  type: random_forest   # tenuto fisso: variabile di controllo, non parte del confronto